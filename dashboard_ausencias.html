<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forecast Ausencias – IBM</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;color:#1f2328;min-height:100vh}
  header{background:#1f3864;color:#fff;padding:16px 28px;display:flex;align-items:center;gap:16px}
  header img{height:36px}
  header h1{font-size:1.25rem;font-weight:600;letter-spacing:.5px}
  .container{max-width:900px;margin:32px auto;padding:0 16px}
  .card{background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:32px;margin-bottom:28px}
  h2{font-size:1.1rem;font-weight:700;color:#1f3864;margin-bottom:20px;border-bottom:2px solid #e5e7eb;padding-bottom:8px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group.full{grid-column:1/-1}
  label{font-size:.82rem;font-weight:600;color:#57606a;text-transform:uppercase;letter-spacing:.4px}
  label .req{color:#e53e3e}
  select,input,textarea{border:1.5px solid #d1d5db;border-radius:6px;padding:9px 12px;font-size:.95rem;color:#1f2328;background:#fff;transition:border-color .2s}
  select:focus,input:focus,textarea:focus{outline:none;border-color:#3b82d4}
  textarea{resize:vertical;min-height:70px}
  .dias-badge{display:inline-block;background:#e8f0fe;color:#1f3864;border-radius:20px;padding:6px 18px;font-size:1.1rem;font-weight:700;margin-top:4px}
  .btn{background:#1f3864;color:#fff;border:none;border-radius:6px;padding:11px 28px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
  .btn:hover{background:#2d5299}
  .btn:disabled{background:#9ca3af;cursor:not-allowed}
  .msg{padding:12px 18px;border-radius:6px;font-size:.93rem;margin-top:14px;display:none}
  .msg.ok{background:#dcfce7;color:#166534;display:block}
  .msg.err{background:#fee2e2;color:#991b1b;display:block}
  .msg.info{background:#e0f2fe;color:#075985;display:block}
  .table-wrap{overflow-x:auto;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th{background:#1f3864;color:#fff;padding:9px 12px;text-align:left;font-weight:600}
  td{padding:8px 12px;border-bottom:1px solid #e5e7eb;vertical-align:middle}
  tr:hover td{background:#f7f8fa}
  .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:600}
  .badge-green{background:#dcfce7;color:#166534}
  .badge-yellow{background:#fef9c3;color:#854d0e}
  .badge-red{background:#fee2e2;color:#991b1b}
  .badge-blue{background:#dbeafe;color:#1e40af}
  .badge-gray{background:#f3f4f6;color:#374151}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:1}}
</style>
</head>
<body>
<header>
  <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/IBM_logo.svg" alt="IBM"/>
  <h1>Forecast de Ausencias</h1>
</header>

<div class="container">

  <!-- FORMULARIO -->
  <div class="card">
    <h2>📋 Registrar Ausencia</h2>
    <form id="frmAus" autocomplete="off">
      <div class="form-grid">

        <div class="form-group">
          <label>ADCAR <span class="req">*</span></label>
          <select id="ausAdcar" required>
            <option value="">— Selecciona —</option>
          </select>
        </div>

        <div class="form-group">
          <label>Motivo <span class="req">*</span></label>
          <select id="ausMotivo" required>
            <option value="">— Selecciona —</option>
            <option>Vacaciones</option>
            <option>Incapacidad</option>
            <option>Permiso</option>
            <option>Capacitación</option>
            <option>Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label>Fecha Inicio <span class="req">*</span></label>
          <input type="date" id="ausFechaInicio" required/>
        </div>

        <div class="form-group">
          <label>Fecha Fin <span class="req">*</span></label>
          <input type="date" id="ausFechaFin" required/>
        </div>

        <div class="form-group">
          <label>Días de Ausencia</label>
          <span class="dias-badge" id="ausDiasBadge">0 días</span>
          <input type="hidden" id="ausDias" value="0"/>
        </div>

        <div class="form-group">
          <label>Fecha de Solicitud <span class="req">*</span></label>
          <input type="date" id="ausFechaSol" required/>
        </div>

        <div class="form-group">
          <label>Backup (Nombre)</label>
          <input type="text" id="ausBackup" placeholder="Nombre del compañero de backup"/>
        </div>

        <div class="form-group">
          <label>Correo Backup</label>
          <input type="email" id="ausBackupEmail" placeholder="correo@ibm.com"/>
        </div>

        <div class="form-group">
          <label>Aprobante</label>
          <select id="ausAprobante">
            <option value="">— Selecciona —</option>
            <option>Laura Milena Pinto</option>
            <option>Juan David Gomez</option>
            <option>Gerente Regional</option>
          </select>
        </div>

        <div class="form-group">
          <label>Estado Aprobación</label>
          <select id="ausEstado">
            <option value="">— Selecciona —</option>
            <option>Pendiente</option>
            <option>Aprobado</option>
            <option>Rechazado</option>
          </select>
        </div>

        <div class="form-group full">
          <label>Observaciones</label>
          <textarea id="ausObs" placeholder="Notas adicionales…"></textarea>
        </div>

      </div><!-- /form-grid -->

      <div style="margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button type="submit" class="btn" id="btnGuardar">💾 Guardar en Monday</button>
        <button type="button" class="btn" id="btnCargar" style="background:#2d5299">🔄 Cargar tablero</button>
      </div>
      <div id="msgForm" class="msg"></div>
    </form>
  </div>

  <!-- TABLERO -->
  <div class="card">
    <h2>📊 Tablero Ausencias</h2>
    <div id="msgBoard" class="msg"></div>
    <div class="table-wrap">
      <table id="tblBoard">
        <thead>
          <tr>
            <th>ADCAR</th>
            <th>Backup</th>
            <th>Correo Backup</th>
            <th>Motivo</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Días</th>
            <th>Solicitado</th>
            <th>Aprobante</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tblBody">
          <tr><td colspan="10" style="text-align:center;color:#9ca3af;padding:24px">Haz clic en "Cargar tablero"</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- /container -->

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const PROXY   = 'https://ibm-dashboards.onrender.com';
const BOARD   = '18432588237';
const COL = {
  backup:         'text_mm7gxx4s',
  motivo:         'status',
  region:         'color_mm7g7naz',
  fecha_sol:      'date4',
  cronograma:     'timerange_mm7gjxra',
  dias:           'numeric_mm7gf0nh',
  soporte:        'file_mm7g6w04',
  aprobante:      'color_mm7qmmkn',
  estado:         'color_mm7gg2a7',
  observaciones:  'text_mm7g4np1'
};

// Mapa ADCAR → item_id Monday (se llena al cargar tablero)
let adcarMap = {};  // { "Nombre ADCAR": monday_item_id }

// ─── HELPERS ───────────────────────────────────────────────────────────────
async function gql(query, variables={}) {
  const res = await fetch(PROXY + '/api/monday', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ query, variables })
  });
  const j = await res.json();
  if (j.errors) throw new Error(j.errors[0].message);
  return j.data;
}

function showMsg(id, txt, type) {
  const el = document.getElementById(id);
  el.className = 'msg ' + type;
  el.textContent = txt;
  if (type === 'ok') setTimeout(() => { el.className='msg'; el.textContent=''; }, 5000);
}

function badgeEstado(val) {
  if (!val) return '<span class="badge badge-gray">—</span>';
  const v = val.toLowerCase();
  if (v.includes('aprobad')) return `<span class="badge badge-green">${val}</span>`;
  if (v.includes('rechaz'))  return `<span class="badge badge-red">${val}</span>`;
  if (v.includes('pendient')) return `<span class="badge badge-yellow">${val}</span>`;
  return `<span class="badge badge-blue">${val}</span>`;
}

// Calcular días hábiles entre dos fechas (lun–vie)
function calcDias(ini, fin) {
  if (!ini || !fin) return 0;
  let d1 = new Date(ini + 'T12:00:00');
  let d2 = new Date(fin + 'T12:00:00');
  if (d2 < d1) return 0;
  let dias = 0;
  let cur = new Date(d1);
  while (cur <= d2) {
    const dow = cur.getDay();
    if (dow !== 0 && dow !== 6) dias++;
    cur.setDate(cur.getDate() + 1);
  }
  return dias;
}

// ─── CARGAR ADCARs (Slide 1 — sin duplicados) ─────────────────────────────
async function loadAdcars() {
  try {
    const data = await gql(`
      query { boards(ids:[${BOARD}]) {
        items_page(limit:200) { items { id name } }
      }}
    `);
    const items = data.boards[0].items_page.items;
    const sel = document.getElementById('ausAdcar');

    // Limpiar mapa y select
    adcarMap = {};
    sel.innerHTML = '<option value="">— Selecciona —</option>';

    // Deduplicar por nombre (Set)
    const seen = new Set();
    items.forEach(it => {
      adcarMap[it.name] = it.id;  // último ID si hay homónimos
      if (!seen.has(it.name)) {
        seen.add(it.name);
        const opt = document.createElement('option');
        opt.value = it.name;
        opt.textContent = it.name;
        sel.appendChild(opt);
      }
    });
  } catch(e) {
    console.warn('No se pudieron cargar ADCARs:', e.message);
  }
}

// ─── CALCULAR DÍAS AUTO ────────────────────────────────────────────────────
function recalcDias() {
  const ini = document.getElementById('ausFechaInicio').value;
  const fin = document.getElementById('ausFechaFin').value;
  const d = calcDias(ini, fin);
  document.getElementById('ausDias').value = d;
  document.getElementById('ausDiasBadge').textContent = d + ' día' + (d !== 1 ? 's' : '');
}
document.getElementById('ausFechaInicio').addEventListener('change', recalcDias);
document.getElementById('ausFechaFin').addEventListener('change', recalcDias);

// Fecha de solicitud = hoy por defecto
document.getElementById('ausFechaSol').value = new Date().toISOString().slice(0,10);

// ─── GUARDAR EN MONDAY ────────────────────────────────────────────────────
document.getElementById('frmAus').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btnGuardar');
  btn.disabled = true;

  const adcar     = document.getElementById('ausAdcar').value.trim();
  const motivo    = document.getElementById('ausMotivo').value;
  const fechaIni  = document.getElementById('ausFechaInicio').value;
  const fechaFin  = document.getElementById('ausFechaFin').value;
  const dias      = parseInt(document.getElementById('ausDias').value) || 0;
  const fechaSol  = document.getElementById('ausFechaSol').value;
  const backup    = document.getElementById('ausBackup').value.trim();
  const backupEmail = document.getElementById('ausBackupEmail').value.trim();
  const aprobante = document.getElementById('ausAprobante').value;
  const estado    = document.getElementById('ausEstado').value;
  const obs       = document.getElementById('ausObs').value.trim();

  if (!adcar || !motivo || !fechaIni || !fechaFin) {
    showMsg('msgForm', '⚠️ Completa los campos obligatorios (ADCAR, Motivo, Fechas).', 'err');
    btn.disabled = false;
    return;
  }

  showMsg('msgForm', '⏳ Sincronizando con Monday…', 'info');

  try {
    // Valor de backup: nombre + correo si existe
    const backupVal = backupEmail
      ? (backup ? backup + ' | ' + backupEmail : backupEmail)
      : backup;

    // Cronograma timeline JSON
    const cronograma = JSON.stringify({ from: fechaIni, to: fechaFin });

    // Columnas a actualizar
    const colVals = {
      [COL.backup]:        backupVal,
      [COL.motivo]:        { label: motivo },
      [COL.fecha_sol]:     { date: fechaSol },
      [COL.cronograma]:    cronograma,
      [COL.dias]:          dias,
      [COL.observaciones]: obs
    };
    if (aprobante) colVals[COL.aprobante] = { label: aprobante };
    if (estado)    colVals[COL.estado]    = { label: estado };

    const colValsStr = JSON.stringify(JSON.stringify(colVals));

    const existingId = adcarMap[adcar];

    if (existingId) {
      // ── ACTUALIZAR fila existente ───────────────────────────────────────
      await gql(
        `mutation($id:ID!,$vals:JSON!){
          change_multiple_column_values(item_id:$id,board_id:${BOARD},column_values:$vals){id}
        }`,
        { id: existingId, vals: JSON.parse(colValsStr) }
      );
      showMsg('msgForm', '✅ Fila actualizada en Monday para ' + adcar, 'ok');
    } else {
      // ── CREAR fila nueva ────────────────────────────────────────────────
      const res = await gql(
        `mutation($name:String!,$vals:JSON!){
          create_item(board_id:${BOARD},item_name:$name,column_values:$vals){id name}
        }`,
        { name: adcar, vals: JSON.parse(colValsStr) }
      );
      const newId = res.create_item.id;
      adcarMap[adcar] = newId;
      // Agregar al select si no estaba
      const sel = document.getElementById('ausAdcar');
      const exists = Array.from(sel.options).some(o => o.value === adcar);
      if (!exists) {
        const opt = document.createElement('option');
        opt.value = adcar;
        opt.textContent = adcar;
        sel.appendChild(opt);
      }
      showMsg('msgForm', '✅ Ausencia registrada en Monday para ' + adcar, 'ok');
    }

    loadBoard();
  } catch(err) {
    showMsg('msgForm', '❌ Error: ' + err.message, 'err');
  }

  btn.disabled = false;
});

// ─── CARGAR TABLERO ───────────────────────────────────────────────────────
document.getElementById('btnCargar').addEventListener('click', loadBoard);

async function loadBoard() {
  showMsg('msgBoard', '⏳ Cargando…', 'info');
  try {
    const data = await gql(`
      query {
        boards(ids:[${BOARD}]) {
          items_page(limit:200) {
            items {
              id name
              column_values {
                id
                ... on TextValue { text }
                ... on StatusValue { label }
                ... on DateValue { date }
                ... on TimelineValue { from to }
                ... on NumbersValue { number }
              }
            }
          }
        }
      }
    `);

    const items = data.boards[0].items_page.items;
    const tbody = document.getElementById('tblBody');

    // Actualizar mapa
    adcarMap = {};
    items.forEach(it => { adcarMap[it.name] = it.id; });

    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#9ca3af;padding:24px">Sin registros</td></tr>';
      showMsg('msgBoard', '', '');
      return;
    }

    tbody.innerHTML = items.map(it => {
      const cv = {};
      it.column_values.forEach(c => { cv[c.id] = c; });

      const backup    = cv[COL.backup]?.text || '—';
      // Separar nombre y correo de backup
      const bParts    = backup.split(' | ');
      const bNombre   = bParts[0] || '—';
      const bCorreo   = bParts[1] || '—';
      const motivo    = cv[COL.motivo]?.label || '—';
      const desde     = cv[COL.cronograma]?.from || '—';
      const hasta     = cv[COL.cronograma]?.to   || '—';
      const dias      = cv[COL.dias]?.number != null ? cv[COL.dias].number : '—';
      const solicitado= cv[COL.fecha_sol]?.date  || '—';
      const aprobante = cv[COL.aprobante]?.label || '—';
      const estado    = cv[COL.estado]?.label    || '—';

      return `<tr>
        <td><strong>${it.name}</strong></td>
        <td>${bNombre}</td>
        <td style="font-size:.82rem">${bCorreo}</td>
        <td>${motivo}</td>
        <td>${desde}</td>
        <td>${hasta}</td>
        <td style="text-align:center"><strong>${dias}</strong></td>
        <td>${solicitado}</td>
        <td>${aprobante}</td>
        <td>${badgeEstado(estado)}</td>
      </tr>`;
    }).join('');

    document.getElementById('msgBoard').className = 'msg';
    document.getElementById('msgBoard').textContent = '';
  } catch(err) {
    showMsg('msgBoard', '❌ Error al cargar: ' + err.message, 'err');
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────
loadAdcars();
loadBoard();
</script>
</body>
</html>
